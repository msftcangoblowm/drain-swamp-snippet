[tox]
# pyenv versions
# pyenv install --list
# pyenv global 3.11 3.12 3.13 3.14 3.15 pypy3.11
# echo "$(pyenv versions --bare)" > {toxworkdir}{/}.python-version
# rm -rf build/lib; cd .tox && tox --root=.. -c ../tox-test.ini -e py311-linux --workdir=.; cd - &>/dev/null
# rm -rf build/lib; cd .tox && tox --root=.. -c ../tox-test.ini -e 311-linux --workdir=.; cd - &>/dev/null
# rm -rf build/lib; cd .tox && tox --root=.. -c ../tox-test.ini -e 3.11-linux --workdir=.; cd - &>/dev/null
# rm -rf build/lib; cd .tox && tox -r --root=.. -c ../tox-test.ini -e pypy-3.11-linux --workdir=.; cd - &>/dev/null

# pypy3.11 requires Rust package manager, Cargo. (7161KB --> 22MB installed)
# sudo xbps-install -S --yes cargo
env_list =
    py311-{linux,macos,windows}
    py312-{linux,macos,windows}
    py313-{linux,macos,windows}
    py314-{linux,macos,windows}
    py315-{linux,macos,windows}
    pypy311-{linux,macos,windows}

toxworkdir = {env:TOXWORKDIR:.tox}

[testenv]
description = Run coverage
deps =
    -r requirements/dev.lock
    build
allowlist_externals =
    pytest
    coverage
usedevelop = False
download = True
passenv = *
setenv =
    #PYTHONWARNINGS=ignore:removed in Python 3.14; use ast.Constant:DeprecationWarning
    # Disable CPython's color output
    PYTHON_COLORS=0
    TOXINIDIR = {toxinidir}
    py{py311,311,312,313,314,315}: COVERAGE_FILE = .coverage.{envname}

# {posargs:-vv} --cov-report=term-missing --showlocals tests
# pytest --cov=drain_swamp_snippet --cov-append --cov-report=term-missing tests
# https://github.com/nedbat/coveragepy/issues/1514
# https://pytest-cov.readthedocs.io/en/latest/tox.html
# https://github.com/pytest-dev/pytest-cov/blob/master/examples/src-layout/tox.ini
commands =
    # there are two patterns: '.coverage.(none).nnn.xxx' and .coverage.{envname}
    # .coverage from previous runs cannot be preserved
    -coverage combine --data-file=.coverage
    -coverage erase --data-file=.coverage
    python -m build
    python -m pip install --disable-pip-version-check -q .
    python -m coverage run --parallel -m pytest {posargs} tests
    coverage combine --data-file=.coverage
    coverage report --data-file=.coverage --fail-under=95

[gh]
# https://pypi.org/project/tox-gh/
# PYVERSIONS
python =
    3.11 = py311
    3.12 = py312
    3.13 = py313
    3.14 = py314
    3.15 = py315
    pypy-3.11 = pypy311
